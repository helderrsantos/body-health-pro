sonar.projectKey=bodyhealthpro
sonar.projectName=Body Health Pro
sonar.projectVersion=1.0

# Fontes analisadas
sonar.sources=apps/admin/src,packages/core/src,packages/auth/src,packages/validation/src,packages/database/src

# Exclusões
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/coverage/**,\
  **/supabase/functions/**

# Cobertura de testes (gerada pelo Vitest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript
sonar.typescript.tsconfigPath=apps/admin/tsconfig.json

# Servidor local (Docker)
sonar.host.url=http://localhost:9000
# Gere o token em: http://localhost:9000 > My Account > Security > Generate Token
sonar.token=COLE_SEU_TOKEN_AQUI

# Encoding
sonar.sourceEncoding=UTF-8
